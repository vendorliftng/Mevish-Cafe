<!DOCTYPE html>
<html>
<head><title>API Test</title></head>
<body>
<h3>API Test Results</h3>
<pre id="log"></pre>
<script>
const API = "https://script.google.com/macros/s/AKfycby-Ght4h30xNFsu8jjGaEsb9wkmCUVaSECJ9j0Gzn6CXqZJ-4SERFyMh5wuwOE9Xy4Zig/exec";
const log = document.getElementById('log');

async function test(label, action, payload) {
  log.textContent += `\n--- ${label} (${action}) ---\n`;
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      redirect: 'follow'
    });
    const text = await res.text();
    log.textContent += `Status: ${res.status}\n`;
    log.textContent += `Response: ${text}\n`;
  } catch (e) {
    log.textContent += `ERROR: ${e.message}\n`;
  }
}

async function run() {
  await test('Add Cashier', 'addCashier', { name: 'Test Cashier', phone: '08012345678', role: 'Cashier', performedBy: 'Manager' });
  await test('New Order', 'newOrder', { orderId: 'TEST-' + Date.now(), customerName: 'Test', orderType: 'Counter', location: 'Counter', cartItems: '1x Jollof Rice', totalPrice: 500, status: 'Active' });
  await test('Toggle Menu', 'toggleMenuAvailability', { id: '1', performedBy: 'Manager' });
  await test('Update Settings', 'updateSettings', { key: 'test', value: 'hello', performedBy: 'Manager' });
  await test('Add Menu Item', 'addMenuItem', { id: Date.now(), name: 'Test Dish', category: 'Foods', price: 1000, cost: 300, prepTime: 15, available: true, description: '', performedBy: 'Manager' });
  log.textContent += `\n=== DONE ===\n`;
}
run();
</script>
</body>
</html>
