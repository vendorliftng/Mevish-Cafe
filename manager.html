<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mevish | Executive Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js for the Wow Factor -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root { --primary: #E63946; --gold: #D4AF37; --dark: #1D1D1D; --green: #2ECC71; --blue: #3498DB; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        body { background: #F4F6F8; color: var(--dark); padding: 20px; }
        
        header { background: var(--dark); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;}
        .logo { font-family: 'Montserrat', sans-serif; font-size: 24px; color: var(--primary); }
        
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, .btn { padding: 10px 15px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; outline: none; transition: 0.2s; }
        .btn-gold { background: var(--gold); color: white; }
        .btn-pdf { background: white; color: var(--dark); }
        .btn:active { transform: scale(0.95); }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; border-bottom: 5px solid var(--primary); }
        .stat-card h3 { color: #6C6C6C; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .stat-card .amount { font-size: 30px; font-weight: 900; font-family: 'Montserrat', sans-serif; color: var(--dark); }
        .stat-card.green { border-bottom-color: var(--green); }
        .stat-card.blue { border-bottom-color: var(--blue); }

        .split-layout { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
        @media (max-width: 1024px) { .split-layout { grid-template-columns: 1fr; } }
        
        .panel { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .panel h2 { font-family: 'Montserrat', sans-serif; margin-bottom: 20px; border-bottom: 2px solid #F4F6F8; padding-bottom: 10px; font-size: 18px; }
        
        .list-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F4F6F8; font-size: 14px; }
        .list-row:last-child { border-bottom: none; }
        .sub-text { font-size: 12px; color: #666; display: block; margin-top: 4px; }
        
        .debt-badge { background: var(--primary); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .backdate-flag { background: #FFF3CD; color: #856404; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-top: 5px; display: inline-block; }

        /* THE 1-CLICK PRINT MAGIC */
        @media print {
            body { background: white; padding: 0; }
            header .controls { display: none; } /* Hide buttons when printing */
            .panel { box-shadow: none; border: 1px solid #EEE; page-break-inside: avoid; }
            .stat-card { box-shadow: none; border: 1px solid #EEE; }
            .split-layout { grid-template-columns: 1fr; gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">EXECUTIVE ANALYTICS</div>
        <div class="controls">
            <span style="font-size: 14px;">Interval:</span>
            <select id="time-filter" onchange="processData()">
                <option value="today">Today</option>
                <option value="week">This Week</option>
                <option value="month">This Month</option>
                <option value="all">All Time</option>
            </select>
            <button class="btn btn-gold" onclick="fetchAnalytics()" id="refresh-btn">🔄 Sync Live</button>
            <button class="btn btn-pdf" onclick="window.print()">🖨️ Export PDF</button>
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="stat-card green">
            <h3>Total Sales</h3>
            <div class="amount" id="total-revenue">₦0</div>
        </div>
        <div class="stat-card">
            <h3>POS Settled</h3>
            <div class="amount" id="total-pos" style="color: var(--primary);">₦0</div>
        </div>
        <div class="stat-card blue">
            <h3>Cash Expected</h3>
            <div class="amount" id="total-cash">₦0</div>
        </div>
    </div>

    <div class="split-layout">
        <!-- Interactive Chart -->
        <div class="panel" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <h2 style="width: 100%; text-align: left;">Revenue Split</h2>
            <div style="position: relative; height: 200px; width: 100%;">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>

        <!-- The Exact Cashier Audit -->
        <div class="panel">
            <h2>Cashier Audit log</h2>
            <div id="cashier-breakdown">Loading data...</div>
        </div>

        <!-- Reconciliation Flags (Debts & Backdates) -->
        <div class="panel">
            <h2>Reconciliation Alerts</h2>
            <div id="debt-breakdown">Loading data...</div>
        </div>
    </div>

    <script>
        // ⚠️ PASTE YOUR REAL APP SCRIPT URL HERE:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEpm1qIgup5q6DBF4F9PEzQD3XEZv0Sqz0otqGdzrbXB079afSjD8P_lpZj1_xpMXy1A/exec";

        let allOrdersData = [];
        let revChart = null; // Holds the Chart.js instance

        // 1. Initialize the Chart
        function initChart() {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            revChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['POS', 'Cash'],
                    datasets: [{ data: [0, 0], backgroundColor: ['#E63946', '#3498DB'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function fetchAnalytics() {
            document.getElementById('refresh-btn').innerText = "Syncing...";
            try {
                const response = await fetch(APPS_SCRIPT_URL + "?type=orders&t=" + new Date().getTime());
                const result = await response.json();
                if (result.status === "success") {
                    allOrdersData = result.data;
                    processData(); 
                }
            } catch (error) {
                alert("Failed to sync database.");
            }
            document.getElementById('refresh-btn').innerText = "🔄 Sync Live";
        }

        // 2. The Smart Date Filter & Math Engine
        function processData() {
            const filterValue = document.getElementById('time-filter').value;
            const now = new Date();
            
            let totalRevenue = 0, totalPOS = 0, totalCash = 0;
            let cashierStats = {}; // Will hold: { "Jamila": { pos: 100, cash: 50 } }
            let alertOrders = [];

            allOrdersData.forEach(order => {
                let amount = parseFloat(order.total) || 0;
                let status = order.status || "";
                let itemsStr = order.items || "";
                
                // --- ACTUAL DATE FILTER LOGIC ---
                let passFilter = true;
                
                // Only filter if they didn't select "All Time" and the order has a valid date
                if (filterValue !== 'all' && order.timestamp) {
                    const orderDate = new Date(order.timestamp);
                    const today = new Date();
                    
                    if (filterValue === 'today') {
                        // Check if the order's Day, Month, and Year match exactly today
                        if (orderDate.toDateString() !== today.toDateString()) passFilter = false;
                        
                    } else if (filterValue === 'week') {
                        // Check if the order is within the last 7 days
                        const oneWeekAgo = new Date();
                        oneWeekAgo.setDate(today.getDate() - 7);
                        if (orderDate < oneWeekAgo || orderDate > today) passFilter = false;
                        
                    } else if (filterValue === 'month') {
                        // Check if the order matches the current Month and Year
                        if (orderDate.getMonth() !== today.getMonth() || orderDate.getFullYear() !== today.getFullYear()) passFilter = false;
                    }
                }
                
                // If the order didn't pass the date check, skip to the next order immediately
                if (!passFilter) return;

                
                // --- CASHIER SPLIT MATH ---
                if (status.includes("Paid")) {
                    totalRevenue += amount;

                    // Extract Cashier Name
                    let match = status.match(/\(([^)]+)\)/);
                    let cashierName = match ? match[1] : "Unknown";
                    
                    if (!cashierStats[cashierName]) cashierStats[cashierName] = { pos: 0, cash: 0, total: 0 };
                    
                    cashierStats[cashierName].total += amount;

                    if (status.includes("POS")) {
                        totalPOS += amount;
                        cashierStats[cashierName].pos += amount;
                    } else if (status.includes("Cash")) {
                        totalCash += amount;
                        cashierStats[cashierName].cash += amount;
                    }
                }

                // --- RECONCILIATION FLAGS ---
                let isAlert = false;
                let alertReason = "";

                if (status.includes("Credit") || status.includes("Unpaid")) {
                    isAlert = true; alertReason = "UNPAID DEBT";
                }
                if (itemsStr.includes("⚠️ BACKDATED TO:")) {
                    isAlert = true; 
                    alertReason = itemsStr.split("⚠️ ")[1].split(" |")[0]; // Extract the warning
                }

                if (isAlert) alertOrders.push({ ...order, alertReason });
            });

            // Update Big Numbers
            document.getElementById('total-revenue').innerText = "₦" + totalRevenue.toLocaleString();
            document.getElementById('total-pos').innerText = "₦" + totalPOS.toLocaleString();
            document.getElementById('total-cash').innerText = "₦" + totalCash.toLocaleString();

            // Update Chart
            revChart.data.datasets[0].data = [totalPOS, totalCash];
            revChart.update();

            // Update Cashier Audit
            const cashierDiv = document.getElementById('cashier-breakdown');
            cashierDiv.innerHTML = "";
            if (Object.keys(cashierStats).length === 0) cashierDiv.innerHTML = "<p style='color:#666;'>No sales in this interval.</p>";
            
            for (const [name, stats] of Object.entries(cashierStats)) {
                cashierDiv.innerHTML += `
                    <div class="list-row" style="flex-direction: column;">
                        <div style="display: flex; justify-content: space-between;">
                            <b>👤 ${name}</b> <span style="color:var(--green); font-weight:bold;">₦${stats.total.toLocaleString()}</span>
                        </div>
                        <div class="sub-text">
                            POS: ₦${stats.pos.toLocaleString()} &nbsp;|&nbsp; Cash: ₦${stats.cash.toLocaleString()}
                        </div>
                    </div>`;
            }

            // Update Alerts
            const debtDiv = document.getElementById('debt-breakdown');
            debtDiv.innerHTML = "";
            if (alertOrders.length === 0) {
                debtDiv.innerHTML = "<p style='color:var(--green);'>Books are perfectly balanced. ✅</p>";
            } else {
                alertOrders.forEach(o => {
                    debtDiv.innerHTML += `
                        <div class="list-row" style="flex-direction: column;">
                            <div style="display: flex; justify-content: space-between;">
                                <span><b>${o.orderId}</b> (${o.name})</span> 
                                <span class="debt-badge">₦${parseFloat(o.total).toLocaleString()}</span>
                            </div>
                            <span class="backdate-flag">${o.alertReason}</span>
                        </div>`;
                });
            }
        }

        window.onload = function() {
            initChart();
            fetchAnalytics();
        };
    </script>
</body>
</html>
